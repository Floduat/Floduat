name: Metrics

on:
  schedule:
    - cron: "0 3 * * *"   # once a day, 03:00 UTC
  workflow_dispatch:       # manual run from the Actions tab

permissions:
  contents: write          # lets the action commit the SVGs into this repo

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # Main card: profile header, activity, repos summary + contribution calendar
      - name: Overview
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Floduat
          filename: metrics/overview.svg
          template: classic
          base: header, activity, repositories
          base_indepth: yes
          config_display: large
          plugin_calendar: yes
          plugin_calendar_limit: 1
          committer_branch: metrics-output
          committer_message: "chore: update metrics overview [skip ci]"

      # Languages card, counted across all repos the token can see (private included)
      - name: Languages
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Floduat
          filename: metrics/languages.svg
          template: classic
          base: ""
          config_display: large
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_threshold: 1%
          plugin_languages_ignored: html, css, scss, shell, dockerfile, makefile, procfile
          committer_branch: metrics-output
          committer_message: "chore: update metrics languages [skip ci]"
